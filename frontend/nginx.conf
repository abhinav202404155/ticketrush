server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip static assets for faster loads
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Proxy to the auth service — the browser never talks to it directly,
  # so there's no CORS to configure and no extra port to expose publicly.
  location /api/auth/ {
    rewrite ^/api/auth/?(.*)$ /$1 break;
    proxy_pass http://auth-service:4001;
    proxy_set_header Host $host;
  }

  # Proxy to the catalog service
  location /api/catalog/ {
    rewrite ^/api/catalog/?(.*)$ /$1 break;
    proxy_pass http://catalog-service:4002;
    proxy_set_header Host $host;
  }

  # Single-page app: any other route falls back to index.html
  location / {
    try_files $uri /index.html;
  }
}
